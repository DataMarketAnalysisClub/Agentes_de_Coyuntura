[project]
name = "dmac-market-brief-agent"
version = "0.14.0"
description = "Agente de coyuntura financiera para el Data Market Analysis Club UDD"
requires-python = ">=3.11"

# Mantener sincronizado con requirements.txt (fuente de verdad para pip install -r).
dependencies = [
    "apscheduler==3.10.4",
    "beautifulsoup4==4.12.3",
    "feedparser==6.0.11",
    "httpx==0.27.2",
    "kaleido==0.2.1",
    "lxml==5.3.0",
    "pandas==2.2.3",
    "plotly==5.24.1",
    "pybreaker==1.0.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "yfinance==1.7.0",
]

# Mantener sincronizado con requirements-dev.txt.
[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
