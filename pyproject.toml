[project]
name = "dmac-market-brief-agent"
version = "0.1.0"
description = "Agente de coyuntura financiera para el Data Market Analysis Club UDD"
requires-python = ">=3.11"

dependencies = [
    "apscheduler==3.10.4",
    "beautifulsoup4==4.12.3",
    "feedparser==6.0.11",
    "httpx==0.27.2",
    "lxml==5.3.0",
    "pandas==2.2.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "pytest==8.3.3",
    "python-dotenv==1.0.1",
    "ruff==0.7.1",
    "yfinance==0.2.48",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
